# Disable all Dev Services globally (we use docker-compose)
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.kafka.devservices.enabled=false
quarkus.apicurio-registry.devservices.enabled=false

# Reactive PostgreSQL - Override YAML to ensure PgPool is created
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:loans}
quarkus.datasource.reactive.max-size=20

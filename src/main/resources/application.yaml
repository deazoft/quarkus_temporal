quarkus:
  application:
    name: loan-application-service

  # Disable ALL Dev Services globally (we use docker-compose)
  devservices:
    enabled: false

  # HTTP Configuration
  http:
    port: 8090
    host: 0.0.0.0

  # Reactive PostgreSQL
  datasource:
    db-kind: postgresql
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    reactive:
      url: postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:loans}
      max-size: 20
    # Disable Dev Services (we use docker-compose)
    devservices:
      enabled: false

  # Flyway migrations
  flyway:
    migrate-at-start: true
    locations: db/migration

  # JSON Logging (OTEL enriched per ADR145/ADR093)
  log:
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p traceId=%X{traceId}, spanId=%X{spanId} [%c{3.}] (%t) %s%e%n"
      json:
        ~: false  # Set to true for JSON logs in production
        additional-field:
          service.name:
            value: loan-application-service
    level: INFO
    category:
      "com.addi.loan":
        level: DEBUG

  # OpenTelemetry - Tracing-First per ADR145/ADR093
  otel:
    enabled: ${OTEL_ENABLED:true}
    exporter:
      otlp:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
        protocol: grpc
    resource:
      attributes:
        service.name: loan-application-service
        deployment.environment: ${ENV:local}
    traces:
      enabled: true
      sampler:
        ratio: 1.0
    logs:
      enabled: true

  # Health & Metrics
  health:
    extensions:
      enabled: true
  micrometer:
    export:
      prometheus:
        enabled: true
        path: /metrics

  # Native image configuration (Mandrel per ADR145)
  native:
    additional-build-args: >
      --initialize-at-run-time=io.temporal,
      -H:+ReportExceptionStackTraces

  # Temporal configuration (vanilla SDK)
  temporal:
    connection:
      target: ${TEMPORAL_ADDRESS:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}

  # Disable all Dev Services (we use docker-compose for infrastructure)
  kafka:
    devservices:
      enabled: false

  apicurio-registry:
    devservices:
      enabled: false

# Kafka configuration (SmallRye Reactive Messaging)
mp:
  messaging:
    incoming:
      loan-requests:
        connector: smallrye-kafka
        topic: loan-requests
        bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        group.id: loan-application-service
        auto.offset.reset: latest
        # Let Quarkus auto-detect the deserializer based on return type

    outgoing:
      loan-decisions:
        connector: smallrye-kafka
        topic: loan-decisions
        bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Application-specific configuration
loan:
  processing:
    auto-approve-threshold: 750
    manual-review-threshold: 650
    max-auto-approve-amount: 50000

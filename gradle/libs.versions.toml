[versions]
quarkus = "3.15.1"
temporal = "1.25.0"
quarkus-temporal = "0.10.0"
lombok = "1.18.34"
mapstruct = "1.6.2"
archunit = "1.3.0"
testcontainers = "1.20.2"
assertj = "3.26.3"

[libraries]
# Quarkus BOM
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }

# Quarkus Core
quarkus-arc = { module = "io.quarkus:quarkus-arc" }
quarkus-resteasy-reactive = { module = "io.quarkus:quarkus-resteasy-reactive" }
quarkus-resteasy-reactive-jackson = { module = "io.quarkus:quarkus-resteasy-reactive-jackson" }
quarkus-hibernate-validator = { module = "io.quarkus:quarkus-hibernate-validator" }
quarkus-smallrye-health = { module = "io.quarkus:quarkus-smallrye-health" }

# Reactive PostgreSQL
quarkus-reactive-pg-client = { module = "io.quarkus:quarkus-reactive-pg-client" }
quarkus-flyway = { module = "io.quarkus:quarkus-flyway" }
quarkus-jdbc-postgresql = { module = "io.quarkus:quarkus-jdbc-postgresql" }

# Kafka
quarkus-smallrye-reactive-messaging-kafka = { module = "io.quarkus:quarkus-smallrye-reactive-messaging-kafka" }
quarkus-confluent-registry-avro = { module = "io.quarkus:quarkus-confluent-registry-avro" }

# OpenTelemetry (Tracing-First)
quarkus-opentelemetry = { module = "io.quarkus:quarkus-opentelemetry" }
quarkus-logging-json = { module = "io.quarkus:quarkus-logging-json" }
quarkus-micrometer-registry-prometheus = { module = "io.quarkus:quarkus-micrometer-registry-prometheus" }

# Temporal (Quarkiverse)
quarkus-temporal = { module = "io.quarkiverse.temporal:quarkus-temporal", version.ref = "quarkus-temporal" }
temporal-sdk = { module = "io.temporal:temporal-sdk", version.ref = "temporal" }
temporal-testing = { module = "io.temporal:temporal-testing", version.ref = "temporal" }

# Utilities
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

# Testing
quarkus-junit5 = { module = "io.quarkus:quarkus-junit5" }
rest-assured = { module = "io.rest-assured:rest-assured" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }
awaitility = { module = "org.awaitility:awaitility" }

[bundles]
quarkus-core = [
    "quarkus-arc",
    "quarkus-resteasy-reactive",
    "quarkus-resteasy-reactive-jackson",
    "quarkus-hibernate-validator",
    "quarkus-smallrye-health"
]
quarkus-database = [
    "quarkus-reactive-pg-client",
    "quarkus-flyway",
    "quarkus-jdbc-postgresql"
]
quarkus-kafka = [
    "quarkus-smallrye-reactive-messaging-kafka",
    "quarkus-confluent-registry-avro"
]
quarkus-observability = [
    "quarkus-opentelemetry",
    "quarkus-logging-json",
    "quarkus-micrometer-registry-prometheus"
]
quarkus-temporal = [
    "quarkus-temporal",
    "temporal-sdk"
]
testing = [
    "quarkus-junit5",
    "rest-assured",
    "archunit-junit5",
    "assertj-core",
    "awaitility",
    "temporal-testing"
]
testcontainers = [
    "testcontainers-postgresql",
    "testcontainers-kafka"
]

[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
